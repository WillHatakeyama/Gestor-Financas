{% extends "base.html" %}
{% block titulo %}Excluir · Controle Financeiro{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card border-danger shadow-sm">
      <div class="card-body">
        <h1 class="h4">Confirmar exclusão</h1>
        <p>Tem certeza de que deseja excluir <strong>{{ object }}</strong>? Esta ação não pode ser desfeita.</p>
        <form method="post">
          {% csrf_token %}
          <button class="btn btn-danger">Excluir</button>
          <a href="{{ voltar_url }}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
