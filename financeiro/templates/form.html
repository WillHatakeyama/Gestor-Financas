{% extends "base.html" %}
{% block titulo %}{{ titulo }} · Controle Financeiro{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <h1 class="h3 mb-4">{{ titulo }}</h1>
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "campos.html" %}
          <button class="btn btn-primary">Salvar</button>
          <a href="{{ voltar_url }}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
